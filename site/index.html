<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ладога · рыболовная карта</title>
  <meta name="description" content="Публичные рыболовные геометки южной Ладоги: Волховская губа, Птинов, Варецкие банки, Сухо, Кобона. Сезоны, рыба, правила, навигатор к точке.">
  <meta name="theme-color" content="#0b2533">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ладога">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body>
  <div id="map" aria-label="Карта южной Ладоги"></div>

  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <strong>Ладога</strong>
        <span id="counter" class="counter">загрузка…</span>
      </div>
      <button type="button" class="wx-pill" id="wxPill" hidden></button>
      <button type="button" class="install-button" id="installButton" hidden>Установить</button>
    </div>
    <div class="active-filters" id="activeFilters"></div>
  </header>

  <div class="fabs">
    <button type="button" class="fab" id="btnLayers" title="Слои карты" aria-label="Слои карты">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-8.2 9.4L2 13.5 12 19l10-5.5-1.8-1.1L12 17l-8.2-4.6Z"/></svg>
    </button>
    <button type="button" class="fab panel-open" id="btnPanel" title="Меню" aria-label="Открыть панель">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
    </button>
    <button type="button" class="fab sos" id="btnSos" title="Экстренная помощь" aria-label="Экстренная помощь">SOS</button>
    <button type="button" class="fab" id="btnLocate" title="Где я" aria-label="Где я">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    </button>
  </div>

  <section class="sheet" id="sheet" data-state="peek" aria-label="Панель">
    <div class="sheet-top">
      <button type="button" class="sheet-handle" id="sheetHandle" aria-label="Развернуть или свернуть панель"><span></span></button>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Свернуть панель">✕</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="today" class="active">Сегодня</button>
      <button type="button" role="tab" data-tab="places">Места</button>
      <button type="button" role="tab" data-tab="season">Сезон</button>
      <button type="button" role="tab" data-tab="fish">Рыба</button>
      <button type="button" role="tab" data-tab="tackle">Снасти</button>
      <button type="button" role="tab" data-tab="depth">Глубины</button>
      <button type="button" role="tab" data-tab="rules">Правила</button>
      <button type="button" role="tab" data-tab="filter">Карта</button>
      <button type="button" role="tab" data-tab="data">Данные</button>
    </nav>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="nav-hud" id="navHud" hidden>
    <div class="nav-top">
      <div class="nav-arrow" id="navArrow" aria-hidden="true">
        <svg viewBox="0 0 100 100"><path d="M50 6 80 88 50 70 20 88Z"/></svg>
      </div>
      <div class="nav-main">
        <div class="nav-title" id="navTitle">—</div>
        <div class="nav-dist" id="navDist">—</div>
        <div class="nav-sub" id="navSub">Жду GPS…</div>
      </div>
    </div>
    <div class="nav-buttons">
      <button type="button" id="navCenter">◎ За мной</button>
      <button type="button" id="navCompass">🧭 Компас</button>
      <button type="button" id="navMark">📍 Метка</button>
      <button type="button" id="navTrack">⏺ Трек</button>
      <button type="button" id="navStop" class="danger">✕ Стоп</button>
    </div>
  </div>

  <div class="month-banner" id="monthBanner" hidden>
    <div class="mb-row">
      <button type="button" id="mbPrev" aria-label="Предыдущий месяц">‹</button>
      <b id="mbMonth" class="mb-month">—</b>
      <button type="button" id="mbNext" aria-label="Следующий месяц">›</button>
      <button type="button" id="mbPlay" aria-label="Играть">▶︎</button>
      <button type="button" id="mbClose" aria-label="Выйти из режима месяцев">✕</button>
    </div>
    <div class="mb-fish" id="mbFish"></div>
  </div>

  <div class="hint" id="hint" hidden>
    <p><b>Цветные точки</b> — места, где рыбаки публиковали улов; цвет — рыба, цифра — сколько отчётов.</p>
    <p><b>Нажмите на точку</b>: подробности, координаты, «Вести к точке» и файл для навигатора.</p>
    <p><b>Внизу</b> — справочники: места, сезон, рыба, глубины, правила.</p>
    <div class="btns" style="margin-bottom:0"><button type="button" class="btn" id="hintOk">Понятно</button><button type="button" class="btn ghost" data-hint-legend>Что значат значки</button></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="vendor/leaflet-heat.js"></script>
  <script src="app.js?v=25"></script>
</body>
</html>

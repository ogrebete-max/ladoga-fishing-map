<text x="20" y="420" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#33414a" text-anchor="start">Альбом телефона (высота &lt; 480 dp): панель данных 340 dp слева, включая safe-area 44 dp со стороны выреза.</text>
<text x="20" y="438" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#33414a" text-anchor="start">Поля 2×2 по 134×76 dp (значения 30 sp); кнопки 56×64, «Завершить» 96×64, зазор 4 dp.</text>
<text x="20" y="456" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#33414a" text-anchor="start">Нижняя навигация, поиск и чипы скрыты. Компас, SOS, + / − и ↺ — на карте справа.</text>

<text x="446" y="175" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#0a0f14" text-anchor="start">Идёт запись: время, км, ср. скорость, метки;</text>

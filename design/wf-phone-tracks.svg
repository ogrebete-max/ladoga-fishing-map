<text x="420" y="94" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#4a5963" text-anchor="start">тост «Трек сохранён — Моё → Треки [Открыть]».</text>
